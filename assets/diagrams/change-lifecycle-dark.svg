<text x="56" y="88" fill="#bfc0c0" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.18em">OWNER · LEADER</text>
<text x="56" y="176" fill="#bfc0c0" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.18em">AUTHOR ROOT</text>
<text x="56" y="264" fill="#bfc0c0" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.18em">REVIEWER</text>
<text x="56" y="352" fill="#bfc0c0" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.18em">MERGE QUEUE</text>
<text x="56" y="440" fill="#bfc0c0" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.18em">RELEASE</text>
