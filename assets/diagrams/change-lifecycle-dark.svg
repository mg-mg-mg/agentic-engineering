<path d="M 340.0,537 H 368.0" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lifecycle-dark-arrow)"/>
<text x="376.0" y="540.5" fill="#bfc0c0" font-size="10" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Loop back / later</text>
