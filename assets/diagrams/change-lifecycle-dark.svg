<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="change-lifecycle-title change-lifecycle-desc" id="lifecycle-dark-root">
<title id="change-lifecycle-title">How one change reaches production</title>
<desc id="change-lifecycle-desc">Swimlane: LEADER admits an Issue; one author root builds in an isolated worktree and opens a PR; a separate read-only reviewer gives one verdict per head; changes mean a new head and a new review; the author enqueues and the PLATFORM merge queue runs admission on the PR combined with current main, refusing back to the author or making a head-pinned squash merge with parent and tree checks; RELEASE ships an exact main SHA only on a release trigger, never per merge.</desc>
<defs>
      <style>#lifecycle-dark-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: #f5f5f5; }
      #lifecycle-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#lifecycle-dark-root .diagram-container { overflow-x: visible; }
}</style><pattern id="lifecycle-dark-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#f5f5f5" fill-opacity="0.08"/></pattern><marker id="lifecycle-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="lifecycle-dark-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#bfc0c0"/></marker><marker id="lifecycle-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs>
