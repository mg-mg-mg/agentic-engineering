<text x="700" y="254" fill="#f08a59" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">MERGEABLE</text>
<rect x="391.2" y="365" width="237.6" height="12" rx="2" fill="#2d3142"/>
<text x="510" y="374" fill="#bfc0c0" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.12em">CHANGES OR REFUSAL → NEW HEAD, NEW REVIEW</text>
<rect x="728.0" y="387" width="120.0" height="12" rx="2" fill="#2d3142"/>
<text x="844" y="396" fill="#bfc0c0" font-size="8" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.12em">ON A RELEASE TRIGGER</text>
<rect x="184" y="56" width="120" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
<text x="244.0" y="76.0" fill="#f5f5f5" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Admit Issue</text>
<text x="244.0" y="90.0" fill="#bfc0c0" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">product judgment</text>
<text x="244.0" y="102.0" fill="#bfc0c0" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">priority · owner</text>
<rect x="336" y="144" width="120" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
<text x="396.0" y="164.0" fill="#f5f5f5" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Build &amp; prove</text>
<text x="396.0" y="178.0" fill="#bfc0c0" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">sole writer</text>
<text x="396.0" y="190.0" fill="#bfc0c0" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">worktree · smoke</text>
<rect x="488" y="144" width="120" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
<text x="548.0" y="164.0" fill="#f5f5f5" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Open PR</text>
<text x="548.0" y="178.0" fill="#bfc0c0" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">self-reviewed</text>
<text x="548.0" y="190.0" fill="#bfc0c0" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">frozen head</text>
<rect x="488" y="232" width="120" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
<text x="548.0" y="252.0" fill="#f5f5f5" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Review</text>
<text x="548.0" y="266.0" fill="#bfc0c0" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">read-only session</text>
<text x="548.0" y="278.0" fill="#bfc0c0" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">1 verdict per head</text>
<rect x="640" y="320" width="120" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
<text x="700.0" y="340.0" fill="#f5f5f5" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Admission run</text>
<text x="700.0" y="354.0" fill="#bfc0c0" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">PR + current main</text>
<text x="700.0" y="366.0" fill="#bfc0c0" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">composed tree</text>
<rect x="792" y="320" width="120" height="56" rx="6" fill="#f08a59" stroke="#f08a59" stroke-width="1" fill-opacity="0.10"/>
<text x="852.0" y="340.0" fill="#f5f5f5" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Squash merge</text>
<text x="852.0" y="354.0" fill="#bfc0c0" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">head-pinned</text>
<text x="852.0" y="366.0" fill="#bfc0c0" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">parent &amp; tree check</text>
<rect x="792" y="408" width="120" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
<text x="852.0" y="428.0" fill="#f5f5f5" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Release</text>
<text x="852.0" y="442.0" fill="#bfc0c0" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">exact main SHA</text>
<text x="852.0" y="454.0" fill="#bfc0c0" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">postcheck</text>
<text x="184" y="430" fill="#bfc0c0" font-size="10" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Payment and release-path PRs get a specialist</text>
<text x="184" y="444" fill="#bfc0c0" font-size="10" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">reviewer (BILLING / RELEASE). Merge is not deploy.</text>
<line x1="40" y1="500" x2="920" y2="500" stroke="#f5f5f5" stroke-width="0.8" stroke-opacity="0.12"/>
<text x="40" y="516" fill="#bfc0c0" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="532" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
<text x="60" y="540.5" fill="#bfc0c0" font-size="10" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Step</text>
<rect x="110.4" y="532" width="14" height="10" rx="2" fill="#f08a59" stroke="#f08a59" stroke-width="1" fill-opacity="0.10"/>
<text x="130.4" y="540.5" fill="#bfc0c0" font-size="10" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Integration point</text>
<path d="M 253.6,537 H 281.6" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lifecycle-dark-arrow)"/>
