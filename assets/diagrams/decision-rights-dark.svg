<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="decision-rights-title decision-rights-desc" id="decisions-dark-root">
<title id="decision-rights-title">Who decides what</title>
<desc id="decision-rights-desc">Quadrant by reversibility and external effect. Agents decide and report reversible internal work: design, refactoring, test strategy, task order, Issues, branches, PRs and docs; copy in seven languages is agent-authored with independent exact-hash review. Code merge runs under standing authority after independent review; production release of an exact main SHA runs under standing release authority, on release triggers only. The Owner decides product direction and pricing once and approves credentials, external sends, payments, store submissions and production data changes.</desc>
