      <style>#decisions-dark-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: #f5f5f5; }
      #decisions-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#decisions-dark-root .diagram-container { overflow-x: visible; }
}</style><pattern id="decisions-dark-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#f5f5f5" fill-opacity="0.08"/></pattern><marker id="decisions-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="decisions-dark-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#bfc0c0"/></marker><marker id="decisions-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs>
