<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="role-sessions-title role-sessions-desc" id="roles-root">
<title id="role-sessions-title">Five ownership roles and bounded workers</title>
<desc id="role-sessions-desc">The Owner sets direction and effect permissions; LEADER owns priorities and conflicts, REVIEW independently assesses frozen source, ENGINEERING owns product source in scope, OPS owns platform and infrastructure source plus the sole merge queue and authorized releases, and GROWTH owns content and analytics in scope; any authoring Root may appoint a sole-writer worker while retaining outcome and integration accountability.</desc>
<defs>
      <style>#roles-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: #2d3142; }
      #roles-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#roles-root .diagram-container { overflow-x: visible; }
}</style><pattern id="roles-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/></pattern><marker id="roles-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="roles-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/></marker><marker id="roles-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker></defs>
<rect width="100%" height="100%" fill="#f5f5f5"/><rect width="100%" height="100%" fill="url(#roles-dots)" opacity="0.55"/>
