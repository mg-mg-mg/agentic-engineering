<path d="M 816,124 V 152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#roles-arrow)"/>
<rect x="380" y="40" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480.0" y="66.0" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Owner</text>
<text x="480.0" y="80.0" fill="#4f5d75" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">direction · priorities · approvals</text>
<rect x="44" y="152" width="200" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="60" y="174" fill="#4f5d75" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.18em">COORDINATE</text>
<rect x="52" y="184" width="184" height="40" rx="4" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="60" y="201" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">LEADER</text>
<text x="60" y="215" fill="#4f5d75" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">priority · conflicts</text>
<line x1="60" y1="226" x2="228" y2="226" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
<text x="60" y="245" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">REVIEW</text>
<text x="60" y="259" fill="#4f5d75" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">independent fixed-head review</text>
<rect x="268" y="152" width="200" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="284" y="174" fill="#4f5d75" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.18em">PRODUCT SOURCE</text>
<text x="284" y="201" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">ENGINEERING</text>
<text x="284" y="221" fill="#4f5d75" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">product · domain · defects</text>
<text x="284" y="239" fill="#4f5d75" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">maintenance · dependencies</text>
<text x="284" y="259" fill="#4f5d75" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">within assigned scope</text>
<rect x="492" y="152" width="200" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="508" y="174" fill="#4f5d75" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.18em">OPERATE &amp; SHIP</text>
<text x="508" y="201" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">OPS</text>
<text x="508" y="221" fill="#4f5d75" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">platform · infrastructure source</text>
<text x="508" y="239" fill="#4f5d75" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">sole merge queue</text>
<text x="508" y="259" fill="#4f5d75" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">authorized exact-SHA releases</text>
<rect x="716" y="152" width="200" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="732" y="174" fill="#4f5d75" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.18em">CONTENT &amp; ANALYTICS</text>
<text x="732" y="201" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">GROWTH</text>
<text x="732" y="221" fill="#4f5d75" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">acquisition · retention · support</text>
<text x="732" y="239" fill="#4f5d75" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">content and analytics source</text>
<text x="732" y="259" fill="#4f5d75" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">within assigned scope</text>
<rect x="44" y="312" width="872" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="60" y="334" fill="#2d3142" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Bounded workers · investigation · implementation · proof</text>
<text x="60" y="352" fill="#4f5d75" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Any authoring Root may appoint the sole branch writer. The Root retains scope, custody and integration accountability.</text>
<rect x="44" y="392" width="872" height="56" rx="6" fill="#ececec" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
<text x="60" y="414" fill="#4f5d75" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.18em">EFFECT AUTHORITY</text>
<text x="60" y="432" fill="#4f5d75" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Money, stores, production data, external sends and credentials retain their permissions. A worker role grants no new authority.</text>
<line x1="40" y1="468" x2="920" y2="468" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
<text x="40" y="484" fill="#4f5d75" font-size="8" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="500" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="60" y="508.5" fill="#4f5d75" font-size="10" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Ownership scope</text>
<rect x="216.79999999999998" y="500" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="236.79999999999998" y="508.5" fill="#4f5d75" font-size="10" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Receives ambiguous work</text>
<path d="M 393.59999999999997,505 H 421.59999999999997" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#roles-arrow)"/>
<text x="429.59999999999997" y="508.5" fill="#4f5d75" font-size="10" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Ownership</text>
</svg>
