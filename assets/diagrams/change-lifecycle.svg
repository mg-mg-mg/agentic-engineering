<text x="548.0" y="266.0" fill="#4f5d75" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">read-only session</text>
<text x="548.0" y="278.0" fill="#4f5d75" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">1 verdict per head</text>
<rect x="640" y="320" width="120" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
