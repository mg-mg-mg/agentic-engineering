<text x="184" y="444" fill="#4f5d75" font-size="10" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Merge, release and observed user outcomes are distinct.</text>
