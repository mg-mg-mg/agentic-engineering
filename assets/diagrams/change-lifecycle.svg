<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="change-lifecycle-title change-lifecycle-desc" id="lifecycle-root">
<title id="change-lifecycle-title">Source, review, merge and release are distinct</title>
<desc id="change-lifecycle-desc">A Root scopes an Issue and appoints one author, which may be a worker, in its canonical worktree; distinct read-only review assesses frozen source; the OPS queue selects required proof on the composed tree and performs pinned integration, while OPS releases an exact main commit only on an authorized trigger and user outcomes require separate observation.</desc>
<defs>
      <style>#lifecycle-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: #2d3142; }
      #lifecycle-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#lifecycle-root .diagram-container { overflow-x: visible; }
}</style><pattern id="lifecycle-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/></pattern><marker id="lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="lifecycle-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f5d75"/></marker><marker id="lifecycle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker></defs>
