<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="incident-loop-title incident-loop-desc" id="loop-dark-root">
<title id="incident-loop-title">Incidents become automated guardrails</title>
<desc id="incident-loop-desc">Loop: operate many agents on one repository; detect problems through review, E2E and gates; record them honestly without backdating; fix the root cause with a regression test; automate a guardrail so the tool refuses next time; send harness bugs upstream as PRs; then keep operating. Evidence and new checks are written into a shared record of repository rules and gates, which the gates read during detection.</desc>
<defs>
      <style>#loop-dark-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: #f5f5f5; }
      #loop-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#loop-dark-root .diagram-container { overflow-x: visible; }
}</style><pattern id="loop-dark-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#f5f5f5" fill-opacity="0.08"/></pattern><marker id="loop-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="loop-dark-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#bfc0c0"/></marker><marker id="loop-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs>
