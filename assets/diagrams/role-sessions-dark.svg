<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="role-sessions-title role-sessions-desc" id="roles-dark-root">
<title id="role-sessions-title">Eleven long-lived role sessions</title>
<desc id="role-sessions-desc">Org chart: the Owner sets direction, priorities and approvals over four groups of long-lived OMP role sessions. Coordinate: LEADER (priority, admission, conflicts; receives ambiguous work) and REVIEW (independent fixed-head review). Build: FEATURE, BUG-FIX, REFACTOR. Platform and ship: PLATFORM (tooling, merge queue) and RELEASE (exact-SHA releases). Specialists: BILLING, GROWTH, DISCOVERY, OPENSOURCE. Money, stores, production data, external messages and credentials still need the Owner.</desc>
