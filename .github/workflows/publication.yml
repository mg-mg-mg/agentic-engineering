name: Publication check
on:
  pull_request:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check staged text and incoming commits
        env:
          PUBLICATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-publication.sh "$PUBLICATION_BASE"
